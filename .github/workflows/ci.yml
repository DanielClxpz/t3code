name: Custom checks

on:
  pull_request:
    branches: [custom]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: custom-checks-${{ inputs.ref || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    # Bot integration commits are checked by the sync workflow's reusable call.
    if: github.event_name != 'pull_request' || github.head_ref != 'automation/upstream'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - run: vp install --frozen-lockfile --filter=@t3tools/monorepo --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/oxlint-plugin-t3code...
      - name: Fork workflow and release safeguards
        run: |
          node scripts/custom-release.mjs policy
          node --test scripts/custom-fork.test.mjs
      - name: Typecheck desktop and its shared runtime
        run: vp run --filter @t3tools/desktop --filter t3 --filter @t3tools/web --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/client-runtime --filter @t3tools/scripts typecheck
      - name: Essential updater and compatibility regressions
        run: >-
          vp test run
          scripts/build-desktop-artifact.test.ts
          scripts/update-release-package-versions.test.ts
          apps/desktop/src/app/DesktopEnvironment.test.ts
          apps/desktop/src/app/DesktopUserData.test.ts
          apps/desktop/src/app/DesktopPreReadyFileSystem.test.ts
          apps/desktop/src/app/DesktopCliShim.test.ts
          apps/desktop/src/app/DesktopAppIdentity.test.ts
          apps/desktop/src/app/DesktopClerk.test.ts
          apps/desktop/src/electron/ElectronProtocol.test.ts
          apps/desktop/src/updates
          apps/server/src/cloud/selfUpdate.test.ts
          apps/server/src/http.test.ts
          packages/shared/src/codexAuthHandoff.test.ts
          packages/shared/src/cliRelease.test.ts
          packages/shared/src/providerAuthReturnUrl.test.ts
          apps/web/src/versionSkew.test.ts
