name: Release T3 Code Custom

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Test uses a GitHub prerelease. Production requires environment approval.
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

concurrency:
  group: custom-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release destination and approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$GITHUB_REPOSITORY" = DanielClxpz/t3code
          node scripts/custom-release.mjs policy
          if [ "$CHANNEL" = production ]; then
            test "$GITHUB_REF" = refs/heads/custom
            gh api "repos/$GITHUB_REPOSITORY/environments/custom-production" --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' | grep -qx true
          fi
      - id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/custom-release.mjs version "$CHANNEL" "$GITHUB_RUN_NUMBER"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  build:
    needs: [prepare, checks]
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - id: store
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: custom-windows-x64-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp install --frozen-lockfile --filter=@t3tools/monorepo --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache resource monitor
        id: monitor
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: custom-monitor-x64-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Install MSVC Spectre libraries
        if: steps.monitor.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process $setup -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC setup failed: $($process.ExitCode)" }
      - name: Align bundled versions and build one Windows installer
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.monitor.outputs.cache-hit == 'true' }}
        shell: pwsh
        run: |
          node scripts/update-release-package-versions.ts $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --release-version $env:VERSION
      - name: Verify updater metadata and packaged versions
        shell: pwsh
        run: |
          node scripts/custom-release.mjs verify release $env:VERSION $env:CHANNEL
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/custom-windows-smoke.mjs release $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: custom-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            release/T3-Code-Custom-*.exe
            release/T3-Code-Custom-*.exe.blockmap
            release/latest.yml
            release/nightly.yml
            release/SHA256SUMS

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'production' && 'custom-production' || 'custom-test' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: custom-windows-x64
          path: release
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists. Start a new workflow run."
            exit 1
          fi
          args=()
          if [ "$CHANNEL" = test ]; then args+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft "${args[@]}" --title "T3 Code Custom $VERSION" --notes "Windows x64 custom build from $GITHUB_SHA. Unsigned installer. Keep a matching data backup and installer before upgrading."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" T3-Code-Custom-*.exe T3-Code-Custom-*.exe.blockmap *.yml SHA256SUMS
          if [ "$CHANNEL" = production ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
