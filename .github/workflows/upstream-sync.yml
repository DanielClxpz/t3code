name: Sync upstream into custom

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-upstream-sync
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'DanielClxpz/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
      conflicts: ${{ steps.sync.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Copy trusted sync helper before merging
        run: cp scripts/custom-upstream-sync.mjs "$RUNNER_TEMP/custom-upstream-sync.mjs"
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/custom-upstream-sync.mjs"

  checks:
    needs: integrate
    if: needs.integrate.outputs.changed == 'true' && needs.integrate.outputs.conflicts == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.integrate.outputs.sha }}

  conflicts:
    needs: integrate
    if: needs.integrate.outputs.conflicts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Upstream conflicts need human review. The draft PR lists the affected files."
          exit 1

  report:
    needs: [integrate, checks]
    if: always() && needs.integrate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Attach verification result to the integration commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.integrate.outputs.sha }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONFLICTS: ${{ needs.integrate.outputs.conflicts }}
        run: |
          state=failure
          if [ "$CHECKS_RESULT" = success ] && [ "$CONFLICTS" = false ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" --method POST \
            -f state="$state" -f context="Custom upstream checks" \
            -f description="Integration checks: $CHECKS_RESULT. Conflicts: $CONFLICTS." \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
